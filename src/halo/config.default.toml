# Halo defaults. Copy to ~/.halo/config.toml to customise; that file replaces
# this one entirely.

# Approximate exchange rate used to show costs in rupees. Update as needed.
usd_to_inr = 85

# Which model-access profile to use. Override per run with HALO_PROFILE
# (for example HALO_PROFILE=nvidia-api in .env while developing).
profile = "token-factory"

# Limits for one coding work session. A run that reaches one stops cleanly.
[coding]
max_cost_inr = 40
max_turns = 30
timeout_s = 900
approval_timeout_s = 300

# Apps Halo may open without asking. Anything not listed here asks first.
# `command` is keyed by sys.platform and is run as an argument list, never
# through a shell.
[apps.vscode]
aliases = ["vs code", "vscode", "visual studio code", "code"]

[apps.vscode.command]
win32 = ["code"]
darwin = ["open", "-a", "Visual Studio Code"]
linux = ["code"]

# --- Model access ------------------------------------------------------
# Every model is NVIDIA Nemotron. The API key is read from the environment
# variable named by `key_env` (put it in .env, never in this file). Ids that
# start with "UNSET" make the client refuse to call. Prices are USD per million
# tokens; leave them out until known and costs are flagged as not known.

# The submission target: Nemotron on Nebius Token Factory. Only runs on this
# profile produce published numbers.
[profiles.token-factory.api]
base_url = "https://api.tokenfactory.nebius.com/v1/"
key_env = "NEBIUS_API_KEY"

# Ids as listed by the Token Factory models endpoint (2026-10-27). Prices are not
# set until read from the console, so costs are flagged as not known.
# WARNING: the prices below (USD per million tokens) are ESTIMATES copied on
# 2026-10-27 from third-party listings (typingmind, benchlm), not from Nebius's own
# price list, which could not be read. Confirm them in the Nebius console before
# publishing any cost figure, then delete this warning.
[profiles.token-factory.models.nano]
id = "nvidia/NVIDIA-Nemotron-3-Nano-30B-A3B"
usd_per_m_input = 0.06
usd_per_m_output = 0.24

[profiles.token-factory.models.super]
id = "nvidia/nemotron-3-super-120b-a12b"
usd_per_m_input = 0.30
usd_per_m_output = 0.90

[profiles.token-factory.models.ultra]
id = "nvidia/Nemotron-3-Ultra-550b-a55b"
usd_per_m_input = 1.00
usd_per_m_output = 3.00

# Token Factory lists no "Nano Omni". The nearest are nvidia/Nemotron-3.5-Super-VL
# and nvidia/Nemotron-3_5-Lightning. Nothing uses this tier yet, so it stays unset
# (the client refuses to call it) until the choice is made.
[profiles.token-factory.models.omni]
id = "UNSET-nano-omni-model-id"

# Development stand-in: the same Nemotron family from NVIDIA's hosted API
# (build.nvidia.com), OpenAI-compatible. Fill the ids from its model list once
# you have a key; `uv run python spikes/list_models.py` prints them.
[profiles.nvidia-api.api]
base_url = "https://integrate.api.nvidia.com/v1"
key_env = "NVIDIA_API_KEY"

# Nemotron thinks before it answers, which cost a Nano call about 4 s here. With
# thinking off a call took under 1 s and the router still scored 20/20 (dev numbers
# on this profile only). Sent with every request, so Super and Ultra also answer
# without thinking: re-check planning quality on Token Factory before relying on it.
[profiles.nvidia-api.api.extra_body.chat_template_kwargs]
enable_thinking = false

# nvidia/nemotron-nano-3-30b-a3b is listed but returns 404 for our account, so the
# same-size 3.5 Lightning model stands in for Nano during development.
[profiles.nvidia-api.models.nano]
id = "nvidia/nemotron-3.5-lightning-30b-a3b"

[profiles.nvidia-api.models.super]
id = "nvidia/nemotron-3-super-120b-a12b"

[profiles.nvidia-api.models.ultra]
id = "nvidia/nemotron-3-ultra-550b-a55b"

[profiles.nvidia-api.models.omni]
id = "nvidia/nemotron-3-nano-omni-30b-a3b-reasoning"
