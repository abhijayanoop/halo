[project]
name = "halo"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "claude-agent-sdk>=0.2.165",
    "fastapi>=0.143.0",
    "langgraph>=1.2.14",
    "langgraph-checkpoint-sqlite>=3.1.1",
    "openai>=3.28.0",
    "pydantic>=2.9,<3",
    "pydantic-settings>=2.15.0",
    "python-frontmatter>=1.3.0",
    "pywebview>=6.2.1",
    "rich>=15.0.0",
    "uvicorn>=0.54.0",
    "watchdog>=6.0.0",
]

[project.scripts]
halo = "halo.cli:entry"
halo-app = "halo.app:entry"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.7",
    "pyright>=1.1.380",
    "pytest-asyncio>=1.4.0",
    "pytest-timeout>=2.4.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
timeout = 30
norecursedirs = ["tests/fixtures"]
markers = [
    "live: tests that call a real hosted model; run with -m live",
]

[tool.pyright]
exclude = ["tests/fixtures", "spikes"]

[tool.ruff]
extend-exclude = ["docs"]

[build-system]
requires = ["uv_build>=0.12.3,<0.13.0"]
build-backend = "uv_build"
